  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;

&lt;body&gt;
&lt;div id=&quot;rotation-column-comparison&quot;&gt;
  &lt;style&gt;

      #rotation-column-comparison .rotation-panels { grid-template-columns: minmax(0, 1fr); gap: 20px; }

  &lt;/style&gt;
  &lt;h3&gt;Rotating vectors versus mixing columns&lt;/h3&gt;
  &lt;div class=&quot;viz-controls&quot;&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;rotation-angle&quot;&gt;
      Rotation angle: &lt;output id=&quot;rotation-angle-value&quot; class=&quot;tabular-nums&quot;&gt;45°&lt;/output&gt;
      &lt;input id=&quot;rotation-angle&quot; class=&quot;form-range&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;90&quot; step=&quot;1&quot; value=&quot;45&quot;&gt;
    &lt;/label&gt;
    &lt;label class=&quot;form-check&quot;&gt;
      &lt;input id=&quot;rotation-equal-lengths&quot; class=&quot;form-check-input&quot; type=&quot;checkbox&quot;&gt;
      &lt;span class=&quot;form-check-label&quot;&gt;Equal initial column lengths&lt;/span&gt;
    &lt;/label&gt;
  &lt;/div&gt;
  &lt;div class=&quot;text-small tabular-nums&quot;&gt;Initial columns: &lt;span id=&quot;rotation-initial-columns&quot;&gt;(2, 0) and (0, 1)&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;rotation-panels&quot;&gt;
    &lt;section class=&quot;rotation-panel&quot; aria-labelledby=&quot;rotation-left-title&quot;&gt;
      &lt;h3 id=&quot;rotation-left-title&quot;&gt;Rotate both arrows · RW&lt;/h3&gt;
      &lt;svg id=&quot;rotation-left-plot&quot; class=&quot;rotation-plot&quot; role=&quot;img&quot; aria-labelledby=&quot;rotation-left-svg-title rotation-left-svg-desc&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;rotation-readout tabular-nums&quot;&gt;Angle: &lt;output id=&quot;rotation-left-angle&quot;&gt;90.0°&lt;/output&gt; · Inner product: &lt;output id=&quot;rotation-left-dot&quot;&gt;0.00&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;text-small tabular-nums&quot;&gt;Column lengths: &lt;output id=&quot;rotation-left-lengths&quot;&gt;2.00 and 1.00&lt;/output&gt;&lt;/div&gt;
    &lt;/section&gt;
    &lt;section class=&quot;rotation-panel&quot; aria-labelledby=&quot;rotation-right-title&quot;&gt;
      &lt;h3 id=&quot;rotation-right-title&quot;&gt;Mix the columns · WR (PPCA)&lt;/h3&gt;
      &lt;svg id=&quot;rotation-right-plot&quot; class=&quot;rotation-plot&quot; role=&quot;img&quot; aria-labelledby=&quot;rotation-right-svg-title rotation-right-svg-desc&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;rotation-readout tabular-nums&quot;&gt;Angle: &lt;output id=&quot;rotation-right-angle&quot;&gt;126.9°&lt;/output&gt; · Inner product: &lt;output id=&quot;rotation-right-dot&quot;&gt;−1.50&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;text-small tabular-nums&quot;&gt;Column lengths: &lt;output id=&quot;rotation-right-lengths&quot;&gt;1.58 and 1.58&lt;/output&gt;&lt;/div&gt;
    &lt;/section&gt;
  &lt;/div&gt;
  &lt;div class=&quot;rotation-legend text-small&quot;&gt;&lt;span class=&quot;rotation-dash&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;Original columns · Arrow labels 1 and 2 identify the resulting columns&lt;/div&gt;
  &lt;div id=&quot;rotation-announcement&quot; class=&quot;sr-only&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&quot;rotation-column-comparison&quot;);
      const find = id =&gt; root.querySelector(&quot;#&quot; + id);
      const slider = find(&quot;rotation-angle&quot;);
      const equal = find(&quot;rotation-equal-lengths&quot;);
      const NS = &quot;http://www.w3.org/2000/svg&quot;;
      const reducedMotion = window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;);
      let current = { theta: 45, firstLength: 2 };
      let animation = 0;

      function elem(tag, attrs, text) {
        const e = document.createElementNS(NS, tag);
        for (const [key, value] of Object.entries(attrs || {})) e.setAttribute(key, value);
        if (text !== undefined) e.textContent = text;
        return e;
      }
      function geometry(theta, a, mode) {
        const angle = theta * Math.PI / 180;
        const c = Math.cos(angle), s = Math.sin(angle);
        return mode === &quot;left&quot; ? [[a*c, a*s], [-s, c]] : [[a*c, s], [-a*s, c]];
      }
      function measures(vectors) {
        const [v, w] = vectors;
        const l1 = Math.hypot(...v), l2 = Math.hypot(...w);
        const dot = v[0]*w[0] + v[1]*w[1];
        const angle = Math.acos(Math.max(-1, Math.min(1, dot/(l1*l2)))) * 180/Math.PI;
        return { l1, l2, dot: Math.abs(dot) &lt; 1e-10 ? 0 : dot, angle };
      }
      const allPoints = [[0, 0]];
      for (const a of [1, 2]) {
        for (let t = 0; t &lt;= 360; t += 5) {
          for (const mode of [&quot;left&quot;, &quot;right&quot;]) allPoints.push(...geometry(t, a, mode));
        }
      }
      const largestCoordinate = Math.max(...allPoints.flat().map(Math.abs));
      const limit = largestCoordinate * 1.3;

      function drawPanel(mode) {
        const svg = find(&quot;rotation-&quot; + mode + &quot;-plot&quot;);
        const width = svg.parentElement.getBoundingClientRect().width;
        if (!width) return;
        const margin = { left: 64, right: 24, top: 16, bottom: 52 };
        const side = width - margin.left - margin.right;
        const height = side + margin.top + margin.bottom;
        const x0 = margin.left, y0 = margin.top;
        const x = value =&gt; x0 + (value + limit) / (2*limit) * side;
        const y = value =&gt; y0 + (limit - value) / (2*limit) * side;
        svg.setAttribute(&quot;viewBox&quot;, &quot;0 0 &quot; + width + &quot; &quot; + height);
        svg.replaceChildren();
        const vectors = geometry(current.theta, current.firstLength, mode);
        const m = measures(vectors);
        svg.append(elem(&quot;title&quot;, { id: &quot;rotation-&quot; + mode + &quot;-svg-title&quot; },
          mode === &quot;left&quot; ? &quot;Apply the same rotation to both column vectors&quot; : &quot;Mix the columns by right multiplication&quot;));
        svg.append(elem(&quot;desc&quot;, { id: &quot;rotation-&quot; + mode + &quot;-svg-desc&quot; },
          &quot;The resulting angle is &quot; + m.angle.toFixed(1) + &quot; degrees and the inner product is &quot; + m.dot.toFixed(2) +
          &quot;. Dashed arrows show the original orthogonal columns. Arrow 1 and arrow 2 show the resulting columns.&quot;));
        const defs = elem(&quot;defs&quot;);
        [&quot;1&quot;, &quot;2&quot;, &quot;ghost&quot;].forEach(name =&gt; {
          const marker = elem(&quot;marker&quot;, {
            id: &quot;rotation-&quot; + mode + &quot;-arrow-&quot; + name, viewBox: &quot;0 0 10 10&quot;,
            refX: &quot;9&quot;, refY: &quot;5&quot;, markerWidth: &quot;6&quot;, markerHeight: &quot;6&quot;,
            orient: &quot;auto&quot;, markerUnits: &quot;strokeWidth&quot;
          });
          marker.append(elem(&quot;path&quot;, { d: &quot;M 0 0 L 10 5 L 0 10 Z&quot;,
            fill: name === &quot;ghost&quot; ? &quot;var(--muted-foreground)&quot; : &quot;var(--viz-series-&quot; + name + &quot;)&quot; }));
          defs.append(marker);
        });
        const clip = elem(&quot;clipPath&quot;, { id: &quot;rotation-&quot; + mode + &quot;-clip&quot; });
        clip.append(elem(&quot;rect&quot;, { x: x0, y: y0, width: side, height: side }));
        defs.append(clip);
        svg.append(defs);
        svg.append(elem(&quot;rect&quot;, { &quot;data-chart-frame&quot;: &quot;&quot;, x: x0, y: y0, width: side, height: side, fill: &quot;none&quot;, stroke: &quot;var(--border)&quot;, &quot;stroke-width&quot;: 1 }));
        const ticks = [-2, -1, 0, 1, 2];
        ticks.forEach(t =&gt; {
          svg.append(elem(&quot;line&quot;, { x1: x(t), x2: x(t), y1: y0, y2: y0+side, stroke: &quot;var(--border)&quot;, &quot;stroke-width&quot;: 1 }));
          svg.append(elem(&quot;line&quot;, { x1: x0, x2: x0+side, y1: y(t), y2: y(t), stroke: &quot;var(--border)&quot;, &quot;stroke-width&quot;: 1 }));
          if (width &gt;= 340 || t % 2 === 0) {
            svg.append(elem(&quot;text&quot;, { x: x(t), y: y0+side+20, &quot;text-anchor&quot;: &quot;middle&quot; }, String(t)));
            svg.append(elem(&quot;text&quot;, { x: x0-12, y: y(t)+4, &quot;text-anchor&quot;: &quot;end&quot; }, String(t)));
          }
        });
        svg.append(elem(&quot;text&quot;, { class: &quot;axis-title&quot;, &quot;data-axis&quot;: &quot;x&quot;, x: x0+side/2, y: height-5, &quot;text-anchor&quot;: &quot;middle&quot; }, &quot;Coordinate 1&quot;));
        svg.append(elem(&quot;text&quot;, { class: &quot;axis-title&quot;, &quot;data-axis&quot;: &quot;y&quot;, transform: &quot;translate(15 &quot; + (y0+side/2) + &quot;) rotate(-90)&quot;, &quot;text-anchor&quot;: &quot;middle&quot; }, &quot;Coordinate 2&quot;));
        const marks = elem(&quot;g&quot;, { &quot;clip-path&quot;: &quot;url(#rotation-&quot; + mode + &quot;-clip)&quot; });
        [[current.firstLength, 0], [0, 1]].forEach(v =&gt; {
          marks.append(elem(&quot;line&quot;, { x1: x(0), y1: y(0), x2: x(v[0]), y2: y(v[1]),
            stroke: &quot;var(--muted-foreground)&quot;, opacity: 0.5, &quot;stroke-width&quot;: 1.5, &quot;stroke-dasharray&quot;: &quot;5 4&quot;,
            &quot;marker-end&quot;: &quot;url(#rotation-&quot; + mode + &quot;-arrow-ghost)&quot; }));
        });
        vectors.forEach((v, i) =&gt; {
          marks.append(elem(&quot;line&quot;, { &quot;data-column&quot;: i+1, x1: x(0), y1: y(0), x2: x(v[0]), y2: y(v[1]),
            stroke: &quot;var(--viz-series-&quot; + (i+1) + &quot;)&quot;, &quot;stroke-width&quot;: 3,
            &quot;marker-end&quot;: &quot;url(#rotation-&quot; + mode + &quot;-arrow-&quot; + (i+1) + &quot;)&quot; }));
          const length = Math.hypot(...v);
          const lx = x(v[0]) + 15*v[0]/length;
          const ly = y(v[1]) - 15*v[1]/length + 4;
          const label = elem(&quot;text&quot;, { x: lx, y: ly, &quot;text-anchor&quot;: &quot;middle&quot;, &quot;font-weight&quot;: 500, &quot;data-vector-label&quot;: &quot;&quot; }, String(i+1));
          marks.append(label);
        });
        let a1 = Math.atan2(vectors[0][1], vectors[0][0]);
        let a2 = Math.atan2(vectors[1][1], vectors[1][0]);
        if (a2 &lt; a1) a2 += 2*Math.PI;
        const radius = Math.min(30, side * 0.115);
        const arcPoints = [];
        for (let j = 0; j &lt;= 40; j++) {
          const a = a1 + (a2-a1)*j/40;
          arcPoints.push((x(0)+radius*Math.cos(a)) + &quot;,&quot; + (y(0)-radius*Math.sin(a)));
        }
        marks.append(elem(&quot;polyline&quot;, { points: arcPoints.join(&quot; &quot;), stroke: &quot;var(--foreground)&quot;, &quot;stroke-width&quot;: 1, fill: &quot;none&quot; }));
        svg.append(marks);
        const mid = (a1+a2)/2;
        svg.append(elem(&quot;text&quot;, {
          x: x(0)+(radius+19)*Math.cos(mid),
          y: y(0)-(radius+19)*Math.sin(mid)+4,
          &quot;text-anchor&quot;: &quot;middle&quot;, &quot;data-angle-label&quot;: &quot;&quot;
        }, m.angle.toFixed(1) + &quot;°&quot;));
        const labelBounds = Array.from(svg.querySelectorAll(&quot;text&quot;)).map(e =&gt; [e, e.getBBox()]);
        labelBounds.forEach(([e, box]) =&gt; {
          if (!e.hasAttribute(&quot;data-vector-label&quot;)) return;
          const dx = Math.max(x0+4-box.x, 0) - Math.max(box.x+box.width-(x0+side-4), 0);
          const dy = Math.max(y0+4-box.y, 0) - Math.max(box.y+box.height-(y0+side-4), 0);
          if (dx || dy) e.setAttribute(&quot;transform&quot;, &quot;translate(&quot; + dx + &quot; &quot; + dy + &quot;)&quot;);
        });
        find(&quot;rotation-&quot; + mode + &quot;-angle&quot;).textContent = m.angle.toFixed(1) + &quot;°&quot;;
        find(&quot;rotation-&quot; + mode + &quot;-dot&quot;).textContent = m.dot.toFixed(2).replace(&quot;-&quot;, &quot;−&quot;);
        find(&quot;rotation-&quot; + mode + &quot;-lengths&quot;).textContent = m.l1.toFixed(2) + &quot; and &quot; + m.l2.toFixed(2);
      }
      function draw() {
        find(&quot;rotation-initial-columns&quot;).textContent = &quot;(&quot; + Number(current.firstLength.toFixed(2)) + &quot;, 0) and (0, 1)&quot;;
        drawPanel(&quot;left&quot;);
        drawPanel(&quot;right&quot;);
      }
      function announce() {
        find(&quot;rotation-announcement&quot;).textContent =
          &quot;Rotating both arrows: &quot; + find(&quot;rotation-left-angle&quot;).textContent +
          &quot;. Mixing columns: &quot; + find(&quot;rotation-right-angle&quot;).textContent +
          &quot;, inner product &quot; + find(&quot;rotation-right-dot&quot;).textContent + &quot;.&quot;;
      }
      function update() {
        cancelAnimationFrame(animation);
        const target = { theta: Number(slider.value), firstLength: equal.checked ? 1 : 2 };
        find(&quot;rotation-angle-value&quot;).textContent = target.theta + &quot;°&quot;;
        slider.setAttribute(&quot;aria-valuetext&quot;, target.theta + &quot; degrees&quot;);
        if (reducedMotion.matches) {
          current = target;
          draw();
          announce();
          return;
        }
        const start = { ...current };
        const startTime = performance.now();
        function frame(now) {
          const t = Math.min(1, (now-startTime)/180);
          const eased = t*t*(3-2*t);
          current = {

    window.crypto?.randomUUID?.() ?? Date.now().toString(36)

  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

    target?.nodeType === Node.ELEMENT_NODE

    target?.nodeType != null &amp;&amp; trigger.contains(target);

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
